<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="upGreenGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="upLeafGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="upGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Glow / Background Ring -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#F0FDF4" stroke="url(#upGreenGradIcon)" stroke-width="3" filter="url(#upGlowIcon)"/>

  <!-- City Buildings Silhouette -->
  <rect x="24" y="50" width="10" height="24" rx="2" fill="url(#upGreenGradIcon)" opacity="0.85"/>
  <rect x="37" y="38" width="11" height="36" rx="2" fill="url(#upGreenGradIcon)"/>
  <rect x="51" y="46" width="9" height="28" rx="2" fill="url(#upGreenGradIcon)" opacity="0.85"/>
  <!-- Building Windows Details -->
  <rect x="40" y="44" width="5" height="4" rx="1" fill="#FFFFFF" opacity="0.9"/>
  <rect x="40" y="52" width="5" height="4" rx="1" fill="#FFFFFF" opacity="0.9"/>
  <rect x="40" y="60" width="5" height="4" rx="1" fill="#FFFFFF" opacity="0.9"/>

  <!-- Pulse Wave ECG Line overlay -->
  <path d="M18 66 L30 66 L38 52 L44 74 L54 34 L62 70 L70 62 L82 62" 
        stroke="url(#upGreenGradIcon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Eco Leaf sprouting from pulse -->
  <path d="M58 32 C58 32 74 26 78 40 C70 48 60 42 58 32 Z" 
        fill="url(#upLeafGradIcon)"/>
  <path d="M60 34 C66 38 72 38 74 40" 
        stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
