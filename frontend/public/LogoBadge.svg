<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular White Background with Emerald Gradient Border -->
  <circle cx="100" cy="100" r="92" fill="#FFFFFF" stroke="url(#badgeGrad)" stroke-width="6" filter="url(#badgeShadow)"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="100" cy="100" r="84" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- City Skyline Silhouette -->
  <g transform="translate(18, 12)">
    <rect x="52" y="66" width="14" height="34" rx="2" fill="url(#badgeGrad)" opacity="0.85"/>
    <rect x="70" y="50" width="16" height="50" rx="3" fill="url(#badgeGrad)"/>
    <rect x="90" y="60" width="14" height="40" rx="2" fill="url(#badgeGrad)" opacity="0.85"/>
    <rect x="108" y="72" width="12" height="28" rx="2" fill="url(#badgeGrad)" opacity="0.7"/>
    
    <!-- Building Windows -->
    <rect x="75" y="58" width="6" height="5" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="75" y="68" width="6" height="5" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="75" y="78" width="6" height="5" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="56" y="74" width="5" height="4" rx="1" fill="#FFFFFF" opacity="0.8"/>
    <rect x="94" y="68" width="5" height="4" rx="1" fill="#FFFFFF" opacity="0.8"/>

    <!-- Pulse Wave ECG Line -->
    <path d="M42 90 L58 90 L68 74 L76 100 L88 48 L98 94 L108 84 L122 84" 
          stroke="url(#badgeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Eco Leaf Sprout -->
    <path d="M92 46 C92 46 112 38 118 56 C108 66 96 60 92 46 Z" 
          fill="url(#leafGrad)"/>
    <path d="M96 50 C102 54 108 54 112 56" 
          stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- Typography: URBAN PULSE -->
  <text x="100" y="152" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5" fill="#064E3B">
    URBAN <tspan fill="url(#badgeGrad)">PULSE</tspan>
  </text>
  
  <!-- Sub-label -->
  <text x="100" y="167" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2" fill="#059669" opacity="0.9">
    SMART CLEANLINESS
  </text>
</svg>
