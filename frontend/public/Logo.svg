<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="upGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="upLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="upGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Icon Container (Circle/Emblem Badge) -->
  <g transform="translate(10, 6)">
    <!-- Outer Glow / Background Ring -->
    <rect x="0" y="0" width="88" height="88" rx="24" fill="#F0FDF4" stroke="url(#upGreenGrad)" stroke-width="3" filter="url(#upGlow)"/>

    <!-- City Buildings Silhouette -->
    <rect x="18" y="44" width="10" height="24" rx="2" fill="url(#upGreenGrad)" opacity="0.85"/>
    <rect x="31" y="32" width="11" height="36" rx="2" fill="url(#upGreenGrad)"/>
    <rect x="45" y="40" width="9" height="28" rx="2" fill="url(#upGreenGrad)" opacity="0.85"/>
    <!-- Building Windows Details -->
    <rect x="34" y="38" width="5" height="4" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="34" y="46" width="5" height="4" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="34" y="54" width="5" height="4" rx="1" fill="#FFFFFF" opacity="0.9"/>

    <!-- Pulse Wave ECG Line overlay -->
    <path d="M12 60 L24 60 L32 46 L38 68 L48 28 L56 64 L64 56 L76 56" 
          stroke="url(#upGreenGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Eco Leaf sprouting from pulse -->
    <path d="M52 26 C52 26 68 20 72 34 C64 42 54 36 52 26 Z" 
          fill="url(#upLeafGrad)"/>
    <path d="M54 28 C60 32 66 32 68 34" 
          stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Typography: URBAN PULSE -->
  <g transform="translate(112, 10)">
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#064E3B">
      URBAN
    </text>
    <text x="135" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="url(#upGreenGrad)">
      PULSE
    </text>
    <!-- Tagline Subtext -->
    <text x="2" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#059669" opacity="0.9">
      SMART CIVIC CLEANLINESS
    </text>
  </g>
</svg>
